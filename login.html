<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | View Livestream</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page d-flex flex-column min-vh-100">

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar px-3 px-md-5">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html#home">
          <img src="logo.png" alt="View Livestream Logo" class="brand-logo" />
          <span class="brand-text">View Livestream</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#browse">Browse Catalogue</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#mylist">My List</a></li>
            <li class="nav-item"><a class="nav-link active" id="navAuthLink" href="login.html">Log In / Sign Up</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About &amp; Help</a></li>
          </ul>
          <a href="index.html#browse" class="btn btn-brand btn-sm px-3 rounded-pill">Explore Series</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card custom-card p-4">
            <div class="d-flex align-items-center gap-2 mb-3">
              <img src="logo.png" alt="View Livestream Icon" class="brand-logo-sm" />
              <h3 class="fw-bold mb-0" id="authTitle">Welcome to View Livestream</h3>
            </div>

            <ul class="nav nav-pills auth-tabs mb-3" id="authTabs">
              <li class="nav-item flex-fill"><button type="button" class="nav-link active w-100" id="tabLogin">Log In</button></li>
              <li class="nav-item flex-fill"><button type="button" class="nav-link w-100" id="tabSignup">Sign Up</button></li>
            </ul>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input type="email" id="loginEmail" class="form-control custom-input" placeholder="you@example.com" autocomplete="email" required />
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control custom-input" placeholder="Your password" autocomplete="current-password" required />
              </div>
              <button type="submit" class="btn btn-brand w-100 fw-semibold">Log In</button>
            </form>

            <form id="signupForm" class="d-none" novalidate>
              <div class="mb-3">
                <label for="signupName" class="form-label">Display Name</label>
                <input type="text" id="signupName" class="form-control custom-input" placeholder="e.g. Teboho Qhwai" autocomplete="name" required />
              </div>
              <div class="mb-3">
                <label for="signupEmail" class="form-label">Email Address</label>
                <input type="email" id="signupEmail" class="form-control custom-input" placeholder="you@example.com" autocomplete="email" required />
              </div>
              <div class="mb-3">
                <label for="signupPassword" class="form-label">Password (min. 6 characters)</label>
                <input type="password" id="signupPassword" class="form-control custom-input" placeholder="Create a password" autocomplete="new-password" required minlength="6" />
              </div>
              <button type="submit" class="btn btn-brand w-100 fw-semibold">Create Account</button>
            </form>

            <div id="signedInView" class="d-none text-center py-3">
              <p class="mb-1 text-light-muted">Signed in as</p>
              <h4 id="welcomeName" class="fw-bold mb-1"></h4>
              <p id="welcomeEmail" class="small text-secondary mb-3"></p>
              <a href="index.html#browse" class="btn btn-brand w-100 mb-2">Go to Catalogue</a>
              <button type="button" id="logoutBtn" class="btn btn-outline-light w-100">Log Out</button>
            </div>

            <div id="formFeedback" class="mt-3"></div>
            <a href="index.html" class="small text-secondary d-inline-block mt-3"><i class="bi bi-arrow-left me-1"></i>Back to home</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-secondary border-top border-secondary-subtle">
    <div class="container"><p class="mb-0">&copy; 2026 View Livestream</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
